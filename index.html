<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mind the Board! — by BROT2YOU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#151d65;--ink2:#3b4290;--soft:#f3f5ff;--line:#dde1f7;--pink:#fc6589;--sun:#ffcf61;--sky:#52c7fa;--mint:#4fd39a;--grape:#8a5cf6;--good:#22b07d;--bad:#ef4f5f;--muted:#6a70a3;
 --disp:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;--body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit}
#bg{position:fixed;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;z-index:0;transition:background .4s}
#board{position:absolute;left:0;right:0;top:58px;bottom:86px;overflow:hidden;z-index:1;transition:top .3s,bottom .3s}
body.pres #board{top:0;bottom:0}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.85);padding:18px 26px;border-radius:20px;font:600 18px var(--disp);text-align:center;box-shadow:0 10px 30px rgba(20,25,60,.15);pointer-events:none}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:50;box-shadow:0 2px 16px rgba(20,25,60,.12);transition:transform .3s}
body.pres #top{transform:translateY(-110%)}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#ff6b9d,#ffb86b 45%,#6bc5ff);display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px var(--disp);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.brand b{display:block;font:700 16px var(--disp);line-height:1}
.brand small{font-size:10px;font-weight:800;opacity:.55;letter-spacing:.06em}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;padding:4px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:12px;font:800 13px var(--body);cursor:pointer;white-space:nowrap;color:var(--ink);flex:0 0 auto}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--ink);color:#fff}
.tab.add{background:var(--soft)}
#clsSel{border:2px solid #e3e6ef;border-radius:12px;padding:7px 8px;font:800 13px var(--body);background:#fff;color:var(--ink);max-width:150px}
.tb{border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex:0 0 auto}
.tb:hover{background:#dfe3f0}
#unhide{position:fixed;right:10px;bottom:10px;z-index:60;border:0;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.7);font-size:18px;cursor:pointer;display:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
body.pres #unhide{display:block}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;height:86px;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:50;box-shadow:0 -2px 16px rgba(20,25,60,.12);transition:transform .3s;align-items:center}
body.pres #dock{transform:translateY(110%)}
.dk{flex:0 0 auto;width:74px;height:68px;border:0;background:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:800 10.5px var(--body);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--c),0 4px 12px rgba(20,25,60,.08);transition:transform .15s;line-height:1.05;text-align:center;padding:2px}
.dk:active{transform:translateY(1px)}
.dk b{font-size:25px;line-height:1}
.dsep{flex:0 0 2px;height:46px;background:#e3e6ef;border-radius:2px;margin:0 3px}
/* widgets */
.wg{position:absolute;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(20,25,60,.18);display:flex;flex-direction:column;overflow:hidden;border:3px solid var(--c);transition:box-shadow .2s}
.wg.drag{box-shadow:0 18px 44px rgba(20,25,60,.32);opacity:.96}
.wg-head{height:30px;flex:0 0 30px;background:var(--c);color:#fff;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;cursor:grab;touch-action:none;font:700 13px var(--disp);user-select:none;-webkit-user-select:none}
.wg-head .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:0;background:rgba(255,255,255,.25);color:#fff;width:24px;height:24px;border-radius:8px;cursor:pointer;font-size:12px;padding:0;flex:0 0 auto}
.hb:hover{background:rgba(255,255,255,.45)}
body.pres .wg-head .hb{display:none}
.wg-body{flex:1;position:relative;container-type:size;overflow:hidden;display:flex;flex-direction:column;min-height:0;transition:background .3s}
.wg-rs{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 52%,var(--c) 52%);opacity:.55;z-index:5}
.wg-rs:hover{opacity:1}
/* generic inner */
.ctr{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 8px;text-align:center;overflow:hidden}
.col{flex-direction:column}
.big{font-family:var(--disp);font-weight:700;line-height:1;font-size:48px;font-size:min(34cqh,24cqw)}
.big.small{font-size:32px;font-size:min(22cqh,12cqw)}
.mono{font-variant-numeric:tabular-nums}
.tap{cursor:pointer}
.name{font-size:40px;font-size:min(24cqh,12cqw);word-break:break-word}
.mid{font-family:var(--disp);font-weight:600;font-size:20px;font-size:clamp(13px,min(10cqh,6.5cqw),64px);margin-top:.25em;line-height:1.15}
.sub{font-size:15px;font-size:clamp(11px,min(7cqh,4.6cqw),36px);opacity:.75;margin-top:.3em;font-weight:700}
.row{display:flex;gap:6px;justify-content:center;align-items:center;padding:4px 8px 6px;flex-wrap:wrap;flex:0 0 auto}
.row.sm{padding-top:0}
.btn{border:0;border-radius:12px;padding:8px 14px;font:800 15px var(--body);background:var(--soft);color:var(--ink);cursor:pointer;min-width:40px;line-height:1.1}
.wg .btn{font-size:15px;font-size:clamp(13px,3.6cqmin,22px)}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--c,#3742fa);color:#fff}
.btn.lg{padding:10px 24px}
.wg .btn.lg{font-size:18px;font-size:clamp(15px,5cqmin,30px)}
.btn.danger{background:#ff4757;color:#fff}
.chip{border:0;border-radius:999px;padding:5px 11px;font:800 12px var(--body);background:var(--soft);cursor:pointer;color:var(--ink);line-height:1.2}
.wg .chip{font-size:12px;font-size:clamp(11px,2.8cqmin,17px)}
.chip.on{background:var(--c,#3742fa);color:#fff}
.inp{border:2px solid #e3e6ef;border-radius:10px;padding:7px 10px;font:700 14px var(--body);flex:1;min-width:0;background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--c,#3742fa)}
.inp.num{flex:0 0 74px;text-align:center;font-size:20px}
.ta{width:100%;min-height:160px;resize:vertical;font-weight:700;line-height:1.5}
.muted{opacity:.6;font-size:13px}
.pbar{width:82%;height:10px;height:clamp(6px,4cqh,22px);background:var(--soft);border-radius:99px;overflow:hidden;margin-top:.6em}
.pbar i{display:block;height:100%;width:100%;transition:width .25s linear,background .3s;border-radius:99px}
.alarm{animation:alarm .5s ease-in-out infinite alternate}
@keyframes alarm{from{background:#fff}to{background:#ffd2d2}}
.flash{animation:alarm .3s ease-in-out 4 alternate}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.emptyc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:10px;font-weight:700}
/* noise */
.nwrap{flex:1;display:flex;gap:10px;padding:8px 10px 4px;min-height:0}
.thermo{position:relative;width:22%;max-width:80px;min-width:28px;background:var(--soft);border-radius:999px;overflow:hidden;border:3px solid #dfe4ea}
.thermo i{position:absolute;left:0;right:0;bottom:0;height:0;background:#2ed573;transition:height .08s,background .3s}
.thermo u{position:absolute;left:0;right:0;height:3px;background:#2f3542;bottom:60%}
.nface{font-size:56px;font-size:min(30cqh,24cqw);line-height:1}
.sliders{display:flex;gap:10px;padding:0 10px 8px;font-size:11px;font-weight:800}
.sliders label{flex:1;display:flex;flex-direction:column;gap:2px}
input[type=range]{accent-color:var(--c,#3742fa);width:100%}
/* traffic */
.tl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;background:#2f3542;margin:8px auto 2px;border-radius:26px;padding:6px 10px;min-height:0}
.tl b{display:block;width:50px;height:50px;width:min(22cqh,58cqw);height:min(22cqh,58cqw);border-radius:50%;opacity:.25;cursor:pointer;transition:opacity .2s,box-shadow .2s}
.tl b.on{opacity:1;box-shadow:0 0 28px var(--g)}
/* work symbols */
.wgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;padding:8px;overflow:auto;align-content:start}
.wopt{border:0;background:#f3f0ff;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:800 11px var(--body);color:var(--ink);line-height:1.1}
.wopt span{font-size:28px}
.wopt.on{outline:3px solid var(--c)}
.wemo{font-size:64px;font-size:min(48cqh,46cqw);line-height:1}
.hint{font-size:10px;text-align:center;opacity:.45;padding-bottom:4px;font-weight:800}
/* text */
.ted{flex:1;outline:none;padding:12px 14px 34px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--disp);font-weight:500;line-height:1.25}
.ted:empty:before{content:attr(data-ph);opacity:.4}
.tbar{position:absolute;right:6px;bottom:6px;display:flex;gap:4px;opacity:.55;transition:opacity .2s}
.tbar:hover,.wg:hover .tbar{opacity:1}
.tbar .chip{background:rgba(0,0,0,.08)}
body.pres .tbar{display:none}
/* plan */
.ptitle{font:700 18px var(--disp);font-size:clamp(15px,7cqmin,48px);padding:8px 12px 2px;outline:none}
.plist{flex:1;overflow:auto;padding:2px 10px;margin:0;list-style:none}
.plist li{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px dashed #e3e6ef;font-weight:700;font-size:15px;font-size:clamp(13px,5.2cqmin,36px)}
.plist li.dn span{text-decoration:line-through;opacity:.45}
.ck{border:0;background:none;font-size:1.15em;cursor:pointer;padding:0;line-height:1}
.plist span{flex:1;outline:none;min-width:0;word-break:break-word}
.x{border:0;background:none;opacity:.35;cursor:pointer;font-size:.85em;padding:0 2px}
.x:hover{opacity:1}
.padd{display:flex;gap:6px;padding:6px 10px 8px}
body.pres .padd,body.pres .x{display:none}
/* dice */
.dice{flex:1;display:flex;align-items:center;justify-content:center;gap:4%;padding:6px;min-height:0}
.die{width:64px;height:64px;background:#fff;border:3px solid #2f3542;border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9%;box-shadow:0 4px 0 #2f3542;flex:0 0 auto}
.die i{display:block;width:72%;height:72%;margin:auto;border-radius:50%;background:#2f3542;visibility:hidden}
.die i.p{visibility:visible}
.die.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}100%{transform:rotate(-10deg)}}
/* poll */
.pq{font:700 16px var(--disp);font-size:clamp(14px,6cqmin,42px);padding:8px 12px 4px;outline:none;text-align:center}
.prows{flex:1;display:flex;flex-direction:column;gap:6px;padding:4px 10px;overflow:auto;justify-content:center;min-height:0}
.prow{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:15px;font-size:clamp(13px,6cqmin,42px);font-weight:800}
.prow .pl{min-width:2em;outline:none;max-width:45%}
.prow .pb{flex:1;height:1.4em;background:var(--soft);border-radius:10px;overflow:hidden;position:relative}
.prow .pb i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:10px;transition:width .3s}
.prow .pc{min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}
.prow:active .pb{outline:3px solid var(--c)}
.prow .x{font-size:.7em}
.hid .pb i{width:0!important}
.hid .pc{visibility:hidden}
/* groups */
.ggrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:6px 10px 12px;align-content:start}
.gcard{border-radius:14px;background:#f7f8fc;overflow:hidden;border:2px solid var(--gc)}
.gcard h4{margin:0;padding:5px 10px;background:var(--gc);color:#fff;font:700 14px var(--disp);font-size:clamp(13px,3.8cqmin,26px)}
.gcard ul{list-style:none;margin:0;padding:6px 10px}
.gcard li{font-size:14px;font-size:clamp(12px,3.3cqmin,24px);padding:2px 0;font-weight:800}
.gcard li small{opacity:.55;font-size:.72em;display:block;margin-top:-2px}
.nv{min-width:24px;text-align:center;font-size:16px}
/* score */
.sgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:8px;overflow:auto;min-height:0}
.scard{border-radius:16px;background:var(--sc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:4px;position:relative;min-height:90px}
.scard .sn{font:700 15px var(--disp);font-size:clamp(13px,4.4cqmin,30px);outline:none;text-align:center}
.scard .sp{font:700 30px var(--disp);font-size:clamp(22px,10cqmin,90px);line-height:1}
.scard .sb{display:flex;gap:6px}
.scard .sb button{border:0;border-radius:10px;background:rgba(255,255,255,.3);color:#fff;font:800 18px var(--body);width:42px;height:34px;cursor:pointer}
.scard.lead:after{content:'👑';position:absolute;top:-2px;right:6px;font-size:22px}
/* hearts */
.hrows{flex:1;display:flex;flex-direction:column;padding:6px 8px 2px;gap:4px;min-height:0}
.hrow{flex:1;min-height:0;display:flex;align-items:center;gap:8px;border-radius:14px;padding:2px 8px;background:#fff1f4;transition:background .3s}
.hrow.dead{background:#e9ecf1}
.hrow.bonus{background:linear-gradient(90deg,#fff1f4,#f1e4ff)}
.hn{flex:0 0 22%;font:700 15px var(--disp);font-size:clamp(12px,min(5cqh,3.6cqw),30px);outline:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hh{flex:1;display:flex;align-items:center;gap:.12em;line-height:1.1;min-width:0;overflow:hidden}
.hrt{cursor:pointer;display:inline-block;transition:transform .15s,opacity .25s;user-select:none;-webkit-user-select:none}
.hrt:active{transform:scale(.85)}
.hrt.off{opacity:.25}
.hrt.lost{animation:lost .6s ease}
@keyframes lost{0%{transform:scale(1.6) rotate(-14deg);opacity:1}55%{transform:scale(.75) rotate(10deg)}100%{transform:none}}
.hrt.fairy{filter:drop-shadow(0 0 6px #c77dff)}
.hrt.fairy.pop{animation:fairy .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes fairy{0%{transform:translateY(-60%) scale(.3) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.hc{display:flex;gap:4px;flex:0 0 auto}
.hbtn{border:0;border-radius:10px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12);min-width:2.2em;height:2em;font:800 14px var(--body);font-size:clamp(12px,min(4.6cqh,3.2cqw),24px);cursor:pointer;color:var(--ink);padding:0 .3em}
.hbtn.plus{background:var(--c);color:#fff}
.hp{flex:0 0 auto;min-width:3.4em;text-align:right;font:700 13px var(--disp);font-size:clamp(11px,min(4.4cqh,3cqw),24px);line-height:1.1}
.hp.neg{color:#d63031}
.hp small{display:block;opacity:.6;font-size:.72em}
.hleg{text-align:center;font-size:11px;font-weight:800;opacity:.6;padding:0 8px}
/* qr / image / embed / webcam / draw */
.qrbox{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0;overflow:hidden}
.qrbox img,.qrbox canvas{max-width:100%;max-height:100%}
.qrurl{font-size:11px;text-align:center;opacity:.6;padding:0 8px 6px;word-break:break-all;font-weight:700}
.fill{flex:1;position:relative;min-height:0}
.fill img,.fill iframe,.fill video{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.fill img,.fill video{object-fit:contain}
.fill video{background:#111}
.fbtn{position:absolute;top:6px;right:6px;z-index:3;border:0;border-radius:10px;background:rgba(255,255,255,.88);padding:5px 9px;font:800 12px var(--body);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
body.pres .fbtn{display:none}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:5px;justify-content:center;padding:6px;z-index:3}
.vbar .chip{background:rgba(255,255,255,.85)}
.mir{transform:scaleX(-1)}
.dbar{display:flex;gap:5px;padding:5px 8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #eee;flex:0 0 auto}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0}
.dot.on{box-shadow:0 0 0 3px var(--ink)}
.dwrap{flex:1;position:relative;background:#fff;min-height:0}
.dwrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.form{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px}
.form .row{padding:0}
.form .inp{flex:0 0 auto;width:100%}
/* mini me */
.mmh{text-align:center;font:700 14px var(--disp);font-size:clamp(12px,4.6cqmin,32px);padding-top:8px;opacity:.7}
.mmn{text-align:center;font:700 28px var(--disp);font-size:clamp(20px,11cqmin,84px);padding:2px 8px;line-height:1.1}
/* modal */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,20,45,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#fff;border-radius:22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);padding-bottom:16px;-webkit-overflow-scrolling:touch}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font:700 19px var(--disp);position:sticky;top:0;background:#fff;z-index:2}
.hb2{border:0;background:var(--soft);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:14px}
.mb{padding:0 18px}
.mb h5{margin:16px 0 8px;font:700 14px var(--disp);opacity:.7;text-transform:uppercase;letter-spacing:.05em}
.ma{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 0;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{font-size:13px;padding:7px 12px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.swb{border:3px solid transparent;border-radius:14px;height:66px;cursor:pointer;position:relative;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swb.on{border-color:var(--ink)}
.swb span{position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.9);border-radius:8px;padding:1px 6px;font:800 10px var(--body)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tplb{border:3px solid var(--soft);background:#fff;border-radius:16px;padding:12px 8px;cursor:pointer;text-align:center;font:800 13px var(--body);color:var(--ink)}
.tplb b{display:block;font-size:28px;margin-bottom:4px}
.tplb small{display:block;font-weight:700;opacity:.55;font-size:11px;margin-top:3px}
.tplb.on{border-color:var(--ink)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}

.mdl{box-shadow:0 12px 0 rgba(0,0,0,.2),0 30px 60px rgba(10,14,50,.35)}
.sndopt.on{box-shadow:0 0 0 3px var(--pink) inset,0 4px 10px rgba(252,101,137,.25)}
/* reflet qui traverse + étincelles */
.shine{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9;overflow:hidden;border-radius:inherit}
.shine:before{content:'';position:absolute;top:-60%;left:-55%;width:32%;height:220%;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 100%);transform:translateX(0) rotate(22deg);animation:shine 1.15s cubic-bezier(.35,.55,.3,1) forwards}
@keyframes shine{to{transform:translateX(560%) rotate(22deg)}}
.spark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;z-index:10;width:38px;height:38px;margin:-19px 0 0 -19px;background:radial-gradient(circle,#fff 0 3px,rgba(255,255,255,0) 5px),linear-gradient(90deg,rgba(255,209,102,0) 43%,#ffe08a 50%,rgba(255,209,102,0) 57%),linear-gradient(0deg,rgba(255,209,102,0) 43%,#ffe08a 50%,rgba(255,209,102,0) 57%);-webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px rgba(255,194,61,.95));animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{transform:scale(0) rotate(0);opacity:0}35%{transform:scale(1.15) rotate(45deg);opacity:1}100%{transform:scale(.2) rotate(110deg);opacity:0}}
body.fx-low #bg:before,body.fx-low #bg:after,body.fx-off #bg:before,body.fx-off #bg:after{display:none}
body.fx-off .shine,body.fx-off .spark{display:none}
@media (hover:hover) and (pointer:fine){
 .btn:hover,.chip:hover{filter:brightness(1.05)}
 .btn.pri:hover{transform:translateY(-1px)}
 .tb:hover{filter:brightness(1.15)}
}
@media (prefers-reduced-motion:reduce){#bg:before,#bg:after{display:none}}
</style>

/* ---------- date / time words ---------- */
var D_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var M_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var D_FR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var M_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var U = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function nw(n){ return n <= 20 ? U[n] : 'twenty-' + U[n - 20]; }
function ord(n){ var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function fmtDate(d, f){
  if (f === 'fr') { var s = D_FR[d.getDay()] + ' ' + (d.getDate() === 1 ? '1er' : d.getDate()) + ' ' + M_FR[d.getMonth()] + ' ' + d.getFullYear(); return s.charAt(0).toUpperCase() + s.slice(1); }
  if (f === 'us') return D_EN[d.getDay()] + ', ' + M_EN[d.getMonth()] + ' ' + ord(d.getDate()) + ', ' + d.getFullYear();
  return D_EN[d.getDay()] + ' ' + ord(d.getDate()) + ' ' + M_EN[d.getMonth()] + ' ' + d.getFullYear();
}
function timeWords(d){
  var hr = d.getHours(), m = d.getMinutes();
  function h12(x){ x = x % 12; return U[x === 0 ? 12 : x]; }
  var part = hr < 12 ? 'in the morning' : (hr < 18 ? 'in the afternoon' : 'in the evening');
  var nh = (m > 30) ? hr + 1 : hr; if (nh >= 12 && nh < 18) part = (nh === 12 && m > 30) ? 'in the afternoon' : part;
  var s;
  if (m === 0) s = h12(hr) + " o'clock";
  else if (m === 15) s = 'quarter past ' + h12(hr);
  else if (m === 30) s = 'half past ' + h12(hr);
  else if (m === 45) s = 'quarter to ' + h12(hr + 1);
  else if (m < 30) s = nw(m) + (m % 5 ? (m === 1 ? ' minute' : ' minutes') : '') + ' past ' + h12(hr);
  else { var r = 60 - m; s = nw(r) + (r % 5 ? (r === 1 ? ' minute' : ' minutes') : '') + ' to ' + h12(hr + 1); }
  if (hr === 12 && m === 0) return "It's twelve o'clock — it's noon!";
  return "It's " + s + ' ' + part + '.';
}

  }, 70);
  return iv;
}

T.noise = { name: 'Sonomètre', ic: '🎤', col: '#0fb9b1', w: 26, h: 52,
  data: function(){ return { thr: 60, sens: 50, warn: 0 }; },
  render: function(b, w){
    var d = w.data, fill = h('i'), line = h('u');
    var face = h('div', { class: 'nface', text: '😴' }), lab = h('div', { class: 'mid', text: L('Mic off', 'Micro coupé') }), wn = h('div', { class: 'sub' });
    var st = h('button', { class: 'btn pri', text: '🎤 Activer', onclick: startStop });
    var s1 = h('input', { type: 'range', min: 10, max: 95, value: d.thr }), s2 = h('input', { type: 'range', min: 5, max: 100, value: d.sens });
    s1.addEventListener('input', function(){ d.thr = +s1.value; line.style.bottom = d.thr + '%'; save(); });
    s2.addEventListener('input', function(){ d.sens = +s2.value; save(); });
    line.style.bottom = d.thr + '%';
    b.appendChild(h('div', { class: 'nwrap' }, [h('div', { class: 'thermo' }, [fill, line]), h('div', { class: 'ctr col' }, [face, lab, wn])]));
    b.appendChild(h('div', { class: 'row sm' }, [st, h('button', { class: 'chip', text: '↺ ⚠️', title: 'Remettre les avertissements à zéro', onclick: function(){ d.warn = 0; save(); showW(); } })]));
    b.appendChild(h('div', { class: 'sliders' }, [h('label', null, ['Seuil d’alerte', s1]), h('label', null, ['Sensibilité du micro', s2])]));
    var stream = null, an = null, buf = null, raf = 0, lv = 0, over = 0, cool = 0, lastT = 0;
    function showW(){ wn.textContent = d.warn ? '⚠️ × ' + d.warn : ''; }
    function startStop(){
      if (stream) { stop(); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { lab.textContent = 'Micro indisponible ici'; return; }
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function(s){
        stream = s; var ac = getAC(); if (ac.state === 'suspended') ac.resume();
        var src = ac.createMediaStreamSource(s); an = ac.createAnalyser(); an.fftSize = 1024; buf = new Uint8Array(an.fftSize);
        src.connect(an); st.textContent = '⏹ Couper'; lastT = Date.now(); loop();
      })['catch'](function(){ lab.textContent = 'Micro refusé ou bloqué'; wn.textContent = 'Autorise le micro (ouvre l’appli depuis son adresse en https).'; });
    }
    function loop(){
      an.getByteTimeDomainData(buf); var sum = 0, i, v;
      for (i = 0; i < buf.length; i++) { v = (buf[i] - 128) / 128; sum += v * v; }
      var target = clamp(Math.sqrt(sum / buf.length) * d.sens * 12, 0, 100);
      lv = target > lv ? lv * 0.6 + target * 0.4 : lv * 0.93 + target * 0.07;
      var now = Date.now(), dt = now - lastT; lastT = now;
      if (lv >= d.thr) over += dt; else over = Math.max(0, over - dt * 2);
      if (over > 1500 && now > cool) { d.warn++; save(); cool = now + 5000; over = 0; b.classList.add('flash'); setTimeout(function(){ b.classList.remove('flash'); }, 1300); SFX.buzz(); }
      paint(); raf = requestAnimationFrame(loop);
    }
    function paint(){
      var r = lv / d.thr, col, f, t;
      if (r < 0.5) { col = '#22b07d'; f = '😊'; t = L('Great! Nice and quiet', 'Parfait, c’est calme'); }
      else if (r < 0.8) { col = '#ffc23d'; f = '🙂'; t = L('Whisper voices', 'On chuchote'); }
      else if (r < 1) { col = '#ff8a4c'; f = '😬'; t = L('Getting loud…', 'Ça monte…'); }
      else { col = '#ef4f5f'; f = '🙉'; t = L('Too loud!', 'Trop fort !'); }
      fill.style.height = lv + '%'; fill.style.background = col; face.textContent = f; lab.textContent = t; showW();
    }
    function stop(){ if (raf) cancelAnimationFrame(raf); raf = 0;
      if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; lv = 0;
      fill.style.height = '0'; face.textContent = '😴'; lab.textContent = L('Mic off', 'Micro coupé'); st.textContent = '🎤 Activer'; }
    showW(); return { destroy: stop };
  } };

  if (isMob()) { var m = mounted[w.id]; if (m && m.el) setTimeout(function(){ m.el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); toast(t.ic + ' ' + t.name + ' ajouté'); }
}
function dupW(w){ var sc = curScene(), c = clone(w); c.id = uid('w'); c.x = clamp(w.x + 3, 0, 90); c.y = clamp(w.y + 4, 0, 90); c.z = ++maxZ;
  sc.widgets.push(c); mount(c); save(); }
function removeW(w){ var sc = curScene(), i = idxBy(sc.widgets, 'id', w.id); if (i < 0) return;
  var m = mounted[w.id]; if (m) { if (m.destroy) try { m.destroy(); } catch (e) {} if (m.el && m.el.parentNode) m.el.parentNode.removeChild(m.el); delete mounted[w.id]; }
  var removed = sc.widgets.splice(i, 1)[0]; save();
  undoToast(removed, sc.id, i);
}
var lastRemoved = null;
function undoToast(w, sid, i){
  lastRemoved = { w: w, sid: sid, i: i };
  var t = document.getElementById('toast'); t.innerHTML = '';
  t.appendChild(document.createTextNode(T[w.type].name + ' fermé · '));
  t.appendChild(h('b', { style: 'text-decoration:underline;cursor:pointer;pointer-events:auto', text: 'Annuler', onclick: function(){
    if (!lastRemoved) return; var sc = findBy(state.scenes, 'id', lastRemoved.sid); if (!sc) return;
    sc.widgets.splice(Math.min(lastRemoved.i, sc.widgets.length), 0, lastRemoved.w); lastRemoved = null; save(); if (sc.id === state.activeScene) { rmEmpty(); mount(w); } t.className = ''; } }));
  t.className = 'on'; t.style.pointerEvents = 'auto';
  clearTimeout(toastT); toastT = setTimeout(function(){ t.className = ''; t.style.pointerEvents = 'none'; }, 4500);
}

/* ================= TOP BAR ================= */
function renderTop(){
  var tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  state.scenes.forEach(function(sc){
    tabs.appendChild(h('button', { class: 'tab' + (sc.id === state.activeScene ? ' on' : ''), text: sc.name, title: 'Touchez à nouveau pour renommer / dupliquer', onclick: function(){
      if (sc.id === state.activeScene) { sceneMenu(sc); return; } state.activeScene = sc.id; save(); renderTop(); renderBoard(); } }));
  });
  tabs.appendChild(h('button', { class: 'tab add', text: '＋ Écran', onclick: newScene }));
  var sel = document.getElementById('clsSel'); sel.innerHTML = '';
  sel.appendChild(h('option', { value: '', text: '— Classe —' }));
  state.classes.forEach(function(c){ sel.appendChild(h('option', { value: c.id, text: c.name })); });
  sel.appendChild(h('option', { value: '__m', text: '⚙️ Gérer…' }));
  sel.value = state.activeClass || '';
}
function setClass(id){ state.activeClass = id; save(); renderTop();
  curScene().widgets.forEach(function(w){ if (T[w.type].cls && mounted[w.id]) { var m = mounted[w.id]; if (m.destroy) try { m.destroy(); } catch (e) {} if (m.el) m.el.parentNode.removeChild(m.el); delete mounted[w.id]; mount(w); } }); }

/* ================= MODALS ================= */
function modal(title, content, actions){
  var ov = h('div', { class: 'ov' }), close = function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); };
  ov.appendChild(h('div', { class: 'mdl' }, [h('div', { class: 'mh' }, [h('span', { text: title }), h('button', { class: 'hb2', text: '✕', onclick: close })]),
    h('div', { class: 'mb' }, [content]), actions ? h('div', { class: 'ma' }, actions) : null]));
  ov.addEventListener('pointerdown', function(e){ if (e.target === ov) close(); });
  document.body.appendChild(ov); return close;
}
function ask(msg, yes, fn){ var close = modal('Confirmation', h('p', { style: 'font-weight:700', text: msg }),
  [h('button', { class: 'btn', text: 'Annuler', onclick: function(){ close(); } }), h('button', { class: 'btn danger', text: yes || 'Oui', onclick: function(){ close(); fn(); } })]); }

function newScene(){
  var sel = 'start', nm = h('input', { class: 'inp', placeholder: 'Nom de l’écran (ex. 5eB – Warm-up)' }), grid = h('div', { class: 'tpl' }), btns = [];
  for (var k in TPL) if (TPL.hasOwnProperty(k)) (function(k){ var b = h('button', { class: 'tplb' + (k === sel ? ' on' : ''), onclick: function(){ sel = k; btns.forEach(function(x){ x[0].classList.toggle('on', x[1] === k); }); } },
      [h('b', { text: TPL[k].e }), TPL[k].n, h('small', { text: TPL[k].s })]); btns.push([b, k]); grid.appendChild(b); })(k);
  var close = modal('Nouvel écran', h('div', null, [h('h5', { text: 'Modèle de départ' }), grid, h('h5', { text: 'Nom' }), nm]),
    [h('button', { class: 'btn pri', text: 'Créer l’écran', onclick: function(){ var bgs = ['arcade', 'papier', 'craie', 'ocean', 'bonbon', 'neon'];
      var sc = makeScene(nm.value.replace(/^\s+|\s+$/g, '') || TPL[sel].n, sel, bgs[state.scenes.length % bgs.length]); state.scenes.push(sc); state.activeScene = sc.id; save(); close(); renderTop(); renderBoard(); } })]);
}
function sceneMenu(sc){
  var nm = h('input', { class: 'inp', value: sc.name });
  var close = modal('Écran « ' + sc.name + ' »', h('div', null, [h('h5', { text: 'Renommer' }), nm,
    h('p', { class: 'muted', text: 'Astuce : prépare un écran par phase de cours (warm-up, activité, évaluation…) et passe de l’un à l’autre d’un clic.' })]), [
    h('button', { class: 'btn danger', text: '🗑️ Supprimer', onclick: function(){ if (state.scenes.length < 2) { toast('Il faut garder au moins un écran.'); return; }
      close(); ask('Supprimer l’écran « ' + sc.name + ' » et ses outils ?', 'Supprimer', function(){ state.scenes.splice(idxBy(state.scenes, 'id', sc.id), 1); state.activeScene = state.scenes[0].id; save(); renderTop(); renderBoard(); }); } }),
    h('button', { class: 'btn', text: '🧹 Vider', onclick: function(){ close(); ask('Retirer tous les outils de cet écran ?', 'Vider', function(){ sc.widgets = []; save(); renderBoard(); }); } }),
    h('button', { class: 'btn', text: '⧉ Dupliquer', onclick: function(){ var c = clone(sc); c.id = uid('s'); c.name = sc.name + ' (copie)'; c.widgets.forEach(function(w){ w.id = uid('w'); });
      state.scenes.splice(idxBy(state.scenes, 'id', sc.id) + 1, 0, c); state.activeScene = c.id; save(); close(); renderTop(); renderBoard(); } }),
    h('button', { class: 'btn', text: '◀', title: 'Déplacer à gauche', onclick: function(){ var i = idxBy(state.scenes, 'id', sc.id); if (i > 0) { state.scenes.splice(i, 1); state.scenes.splice(i - 1, 0, sc); save(); renderTop(); } } }),
    h('button', { class: 'btn', text: '▶', title: 'Déplacer à droite', onclick: function(){ var i = idxBy(state.scenes, 'id', sc.id); if (i < state.scenes.length - 1) { state.scenes.splice(i, 1); state.scenes.splice(i + 1, 0, sc); save(); renderTop(); } } }),
    h('button', { class: 'btn pri', text: 'OK', onclick: function(){ var v = nm.value.replace(/^\s+|\s+$/g, ''); if (v) sc.name = v; save(); close(); renderTop(); } })]);
}

function openClasses(selId){
  var sel = selId || state.activeClass || (state.classes[0] && state.classes[0].id), wrap = h('div');
  function draw(){
    wrap.innerHTML = '';
    var chips = h('div', { class: 'chips' });
    state.classes.forEach(function(c){ chips.appendChild(h('button', { class: 'chip' + (c.id === sel ? ' on' : ''), text: c.name + ' · ' + c.students.length, onclick: function(){ sel = c.id; draw(); } })); });
    chips.appendChild(h('button', { class: 'chip', text: '＋ Nouvelle classe', onclick: function(){ var c = { id: uid('c'), name: 'Nouvelle classe', students: [], absent: [] }; state.classes.push(c); sel = c.id; save(); draw(); } }));
    wrap.appendChild(chips);
    var c = getClass(sel);
    if (!c) { wrap.appendChild(h('p', { class: 'muted', text: 'Crée ta première classe.' })); return; }
    var nm = h('input', { class: 'inp', value: c.name, style: 'width:100%' });
    var ta = h('textarea', { class: 'inp ta', placeholder: 'Un élève par ligne — tu peux copier-coller une colonne depuis Pronote ou un tableur.' }); ta.value = c.students.join('\n');
    function apply(){ c.name = nm.value.replace(/^\s+|\s+$/g, '') || 'Classe';
      var seen = {}; c.students = ta.value.split(/\r?\n/).map(function(l){ return l.replace(/\t+/g, ' ').replace(/^\s+|\s+$/g, ''); }).filter(function(l){ if (!l || seen[l]) return false; seen[l] = 1; return true; });
      c.absent = c.absent.filter(function(n){ return c.students.indexOf(n) >= 0; }); save(); }
    var ab = h('div', { class: 'chips' });
    c.students.forEach(function(n){ var isA = c.absent.indexOf(n) >= 0;
      ab.appendChild(h('button', { class: 'chip', style: isA ? 'background:#ffd6d6;text-decoration:line-through' : '', text: (isA ? '🚫 ' : '✅ ') + n, onclick: function(){ apply(); var k = c.absent.indexOf(n); if (k >= 0) c.absent.splice(k, 1); else c.absent.push(n); save(); draw(); } })); });
    wrap.appendChild(h('h5', { text: 'Nom de la classe' })); wrap.appendChild(nm);
    wrap.appendChild(h('h5', { text: 'Élèves (' + c.students.length + ')' })); wrap.appendChild(ta);
    wrap.appendChild(h('div', { class: 'row', style: 'justify-content:flex-start;padding:6px 0' }, [h('button', { class: 'btn', text: '💾 Enregistrer la liste', onclick: function(){ apply(); draw(); toast('Liste enregistrée'); } }),
      h('button', { class: 'btn', text: '🔤 Trier A→Z', onclick: function(){ apply(); c.students.sort(function(a, b){ return a.localeCompare(b, 'fr'); }); save(); draw(); } })]));
    wrap.appendChild(h('h5', { text: 'Absents aujourd’hui (' + c.absent.length + ') — touchez pour basculer' }));
    wrap.appendChild(c.students.length ? ab : h('p', { class: 'muted', text: 'Ajoute des élèves puis enregistre.' }));
    if (c.absent.length) wrap.appendChild(h('div', { class: 'row', style: 'justify-content:flex-start;padding:6px 0' }, [h('button', { class: 'chip', text: '↺ Tout le monde est là', onclick: function(){ c.absent = []; save(); draw(); } })]));
    wrap.appendChild(h('div', { class: 'row', style: 'justify-content:flex-start;padding:14px 0 0' }, [
      h('button', { class: 'btn danger', text: '🗑️ Supprimer la classe', onclick: function(){ ask('Supprimer la classe « ' + c.name + ' » ?', 'Supprimer', function(){ state.classes.splice(idxBy(state.classes, 'id', c.id), 1);
        if (state.activeClass === c.id) state.activeClass = state.classes[0] ? state.classes[0].id : ''; sel = state.activeClass; save(); draw(); }); } })]));
    wrap._apply = apply; wrap._c = c;
  }
  draw();
  var close = modal('👥 Mes classes', wrap, [h('button', { class: 'btn pri', text: 'Utiliser cette classe', onclick: function(){ if (wrap._apply) wrap._apply(); close(); setClass(sel || ''); } })]);
}

function openBg(){
  var sc = curScene(), wrap = h('div'), all = false;
  function draw(){ wrap.innerHTML = ''; var g = h('div', { class: 'sw' });
    DEF.bgs.forEach(function(p){ var b = h('button', { class: 'swb' + (!sc.bgImg && sc.bg === p.k ? ' on' : ''), onclick: function(){ set(p.k, ''); } }, [h('span', { text: p.n })]); b.style.background = p.css; g.appendChild(b); });
    var up = h('button', { class: 'swb', onclick: function(){ filePicker('image/*', function(f){ loadImg(f, 1920, function(u){ set(sc.bg, u); }); }); } }, [h('span', { text: '📂 Ma photo' })]);
    up.style.background = sc.bgImg ? 'url(' + sc.bgImg + ') center/cover' : 'repeating-linear-gradient(45deg,#eef0f7 0 10px,#fff 10px 20px)'; if (sc.bgImg) up.className += ' on';
    g.appendChild(up); wrap.appendChild(g);
    wrap.appendChild(h('div', { class: 'row', style: 'justify-content:flex-start;padding:12px 0 0' }, [h('button', { class: 'chip' + (all ? ' on' : ''), text: (all ? '✅' : '⬜') + ' Appliquer à tous les écrans', onclick: function(){ all = !all; draw(); } })]));
  }
  function set(k, img){ (all ? state.scenes : [sc]).forEach(function(s){ s.bg = k; s.bgImg = img; }); save(); applyBg(); draw(); }
  draw(); modal('🖼️ Fond d’écran — « ' + sc.name + ' »', wrap);
}

function openSettings(){
  var wrap = h('div');
  function seg(opts, cur, fn){ var s = h('div', { class: 'seg' }); opts.forEach(function(o){ s.appendChild(h('button', { class: o[0] === cur ? 'on' : '', text: o[1], onclick: function(){ fn(o[0]); draw(); } })); }); return s; }
  function draw(){ wrap.innerHTML = '';
    wrap.appendChild(h('h5', { text: 'Langue affichée aux élèves' }));
    wrap.appendChild(seg([['en', '🇬🇧 English'], ['fr', '🇫🇷 Français']], state.settings.lang, function(v){ state.settings.lang = v; save(); renderBoard(); }));
    wrap.appendChild(h('p', { class: 'muted', text: 'Consignes, sonomètre, feu, boutons « Pick! / Roll! »… Les menus restent en français.' }));
    wrap.appendChild(h('h5', { text: 'Sons' }));
    wrap.appendChild(seg([[true, '🔔 Activés'], [false, '🔕 Coupés']], state.settings.sound, function(v){ state.settings.sound = v; save(); }));
    wrap.appendChild(h('div', { class: 'row', style: 'justify-content:flex-start;padding:8px 0 0' }, [h('button', { class: 'btn', text: '🎵 Mes sons (' + (state.sounds || []).length + ')', onclick: function(){ openSounds(); } })]));
    wrap.appendChild(h('h5', { text: '✨ Effets lumineux' }));
    wrap.appendChild(seg([['on', '✨ Wow'], ['low', '🌙 Discrets'], ['off', '⬜ Coupés']], fxLevel(), function(v){ state.settings.fx = v; save(); applyFx(); }));
    wrap.appendChild(h('p', { class: 'muted', text: 'Reflets qui traversent les cadres, étincelles et halos de couleur en fond. « Discrets » pour les classes vite distraites.' }));
    wrap.appendChild(h('h5', { text: 'Mode d’emploi express' }));
    wrap.appendChild(h('ul', { class: 'help' }, [
      h('li', { text: 'Barre du bas : touche un outil pour l’ajouter. Déplace-le par sa barre de titre, agrandis-le par le coin en bas à droite : le contenu grandit avec.' }),
      h('li', { text: 'Onglets en haut : un écran par phase de cours. Touche l’onglet actif pour le renommer, le dupliquer ou le supprimer.' }),
      h('li', { text: '👥 Classes : colle ta liste d’élèves une fois. Tirage, Groupes et Mini Me l’utilisent, sans les absents du jour.' }),
      h('li', { text: '👁️ Mode projection : masque les barres et les boutons pour ne garder que l’essentiel au TBI.' }),
      h('li', { text: '💾 Sauvegarde : tout reste sur cet appareil. Exporte un fichier pour passer du PC de la salle à ta maison.' }),
      h('li', { text: 'Micro et caméra : il faut autoriser le navigateur (adresse en https, comme GitHub Pages).' })]));
    wrap.appendChild(h('h5', { text: 'Zone sensible' }));
    wrap.appendChild(h('button', { class: 'btn danger', text: '♻️ Réinitialiser l’appli', onclick: function(){ ask('Tout effacer (classes, écrans, réglages) ? Pense à exporter avant.', 'Tout effacer', function(){ DB.clear(); SND.cache = {}; unmountAll(); state = freshState(); saveNow(); renderTop(); renderBoard(); applyFx(); toast('Appli réinitialisée'); }); } }));
    wrap.appendChild(h('p', { class: 'muted', style: 'margin-top:16px', text: 'Mind the Board! — by BROT2YOU · gratuit, sans compte, sans pub · données stockées uniquement dans ce navigateur.' }));
  }
  draw(); modal('⚙️ Réglages & aide', wrap);
}

function openSave(){
  var close = modal('💾 Sauvegarde', h('div', null, [
    h('p', { style: 'font-weight:700', text: 'Tout est enregistré automatiquement dans ce navigateur : classes, écrans, outils, cœurs, réglages des minuteurs et sons personnels. Pour tout retrouver sur un autre appareil (salle, maison, TBI) ou garder une copie, exporte un fichier puis importe-le là-bas.' }),
    h('div', { class: 'row', style: 'justify-content:flex-start;padding:4px 0' }, [
      h('button', { class: 'btn pri', text: '⬇️ Tout exporter', onclick: function(){ saveNow();
        DB.all(function(recs){
          var o = clone(state), cnt = 0; o._sounds = {};
          recs.forEach(function(rc){ if (findBy(state.sounds, 'id', rc.id)) { o._sounds[rc.id] = { n: rc.name, d: rc.data }; cnt++; } });
          var blob = new Blob([JSON.stringify(o)], { type: 'application/json' }), n = new Date();
          var a = h('a', { href: URL.createObjectURL(blob), download: 'mind-the-board-' + n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()) + '.json' });
          document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 800);
          toast('Fichier exporté : classes, écrans, réglages' + (cnt ? ' et ' + cnt + ' son' + (cnt > 1 ? 's' : '') : '')); }); } }),
      h('button', { class: 'btn', text: '⬆️ Importer', onclick: function(){ filePicker('application/json,.json', function(f){ var fr = new FileReader();
        fr.onload = function(){ var s = null; try { s = JSON.parse(fr.result); } catch (e) {}
          if (!valid(s)) { toast('Ce fichier n’est pas une sauvegarde Mind the Board!'); return; }
          close(); ask('Remplacer tout ce qui est sur cet appareil par la sauvegarde importée ?', 'Importer', function(){
            var snds = s._sounds || {}; delete s._sounds;
            if (!s.sounds) s.sounds = [];
            for (var sid in snds) if (snds.hasOwnProperty(sid) && !findBy(s.sounds, 'id', sid)) s.sounds.push({ id: sid, name: snds[sid].n || 'Son', kb: Math.round(snds[sid].d.length * .75 / 1024) });
            DB.clear(function(){ var keys = []; for (var k in snds) if (snds.hasOwnProperty(k)) keys.push(k);
              (function nx(){ if (!keys.length) return; var k = keys.shift(); DB.put({ id: k, name: snds[k].n || 'Son', data: snds[k].d }, nx); })(); });
            SND.cache = {}; unmountAll(); state = s; fixState(); saveNow(); renderTop(); renderBoard(); applyFx(); toast('Sauvegarde importée ✅'); }); };
        fr.readAsText(f); }); } })]) ]));
}

/* ================= DOCK & TOP BUTTONS ================= */
(function(){
  var dock = document.getElementById('dock');
  DOCK.forEach(function(grp, gi){ if (gi) dock.appendChild(h('span', { class: 'dsep' }));
    grp.forEach(function(k){ var t = T[k], b = h('button', { class: 'dk', title: t.name, onclick: function(){ addW(k); } }, [icon(k), SHORT[k]]); dock.appendChild(b); }); });
  document.getElementById('logo').appendChild(icon('brand'));
  document.getElementById('bCls').onclick = function(){ openClasses(); };
  document.getElementById('bBg').onclick = openBg;
  document.getElementById('bSet').onclick = openSettings;
  document.getElementById('bSave').onclick = openSave;
  document.getElementById('clsSel').onchange = function(){ var v = this.value; if (v === '__m') { this.value = state.activeClass || ''; openClasses(); return; } setClass(v); };
  document.getElementById('bFull').onclick = function(){ var d = document, e = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    var f = e.requestFullscreen || e.webkitRequestFullscreen; if (f) f.call(e); else toast('Plein écran non disponible ici (sur iPhone : « Sur l’écran d’accueil »).'); };
  document.getElementById('bMenu').onclick = function(){ var close; var it = function(e, l, fn){ return h('button', { onclick: function(){ close(); fn(); } }, [h('b', { text: e }), l]); };
    close = modal('Menu', h('div', { class: 'menu' }, [it('👥', 'Mes classes', function(){ openClasses(); }), it('🖼️', 'Fond d’écran', openBg), it('💾', 'Sauvegarde', openSave), it('⚙️', 'Réglages & aide', openSettings),
      it('👁️', 'Mode projection', function(){ document.getElementById('bHide').onclick(); }), it('➕', 'Nouvel écran', newScene)])); };
  document.getElementById('bHide').onclick = function(){ document.body.classList.add('pres'); toast('Mode projection — 👁️ en bas à droite pour revenir'); };
  document.getElementById('unhide').onclick = function(){ document.body.classList.remove('pres'); };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { var ov = document.querySelector('.ov'); if (ov) ov.parentNode.removeChild(ov); else document.body.classList.remove('pres'); } });
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) saveNow(); });
})();

/* ================= START ================= */
state = load(); fixState(); renderTop(); renderBoard(); saveNow();
window.MTB = { state: function(){ return state; }, DB: DB, fx: fxFire };
applyFx();
var lastWatch = 0;
setInterval(function(){
  for (var id in mounted) if (mounted.hasOwnProperty(id) && mounted[id].tick) mounted[id].tick();
  var now = Date.now(); if (now - lastWatch < 500) return; lastWatch = now;
  state.scenes.forEach(function(sc){ sc.widgets.forEach(function(w){
    if (w.type === 'timer' && w.data.run && !mounted[w.id] && w.data.end <= now) {
      w.data.run = false; w.data.rem = 0; w.data.done = true; save(); SND.play(w.data.snd, w.data.vol);
      toast('⏰ ' + (w.data.lbl || 'Minuteur') + ' terminé — écran « ' + sc.name + ' »'); } }); });
}, 100);
})();
</script>
